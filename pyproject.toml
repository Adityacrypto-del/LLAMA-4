[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvaidya"
version = "0.1.0"
description = "QLoRA-based 8-bit quantization and fine-tuning of Llama-4 Scout MoE for clinical decision support"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
